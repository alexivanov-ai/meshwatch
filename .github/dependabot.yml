# Keep Electron (and thus Chromium) current without a separate Chromium
# maintenance chore. Merging these PRs + shipping a Meshwatch release is how
# end users get a newer Chromium via in-app auto-update.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-name: electron
      - dependency-name: electron-updater
      - dependency-name: electron-builder
    groups:
      electron-stack:
        patterns:
          - "electron*"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Workflow actions are pinned to commit SHAs (see .github/workflows/), so
  # nothing bumps them on its own without this - Dependabot opens a PR that
  # updates the pin and its version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
