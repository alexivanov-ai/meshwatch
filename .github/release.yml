# Categorizes GitHub's automatically generated release notes
# (generate_release_notes: true in .github/workflows/release.yml) by PR
# label, instead of one flat "What's Changed" list. Has no effect until PRs
# start carrying these labels — see https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security 🔒
      labels:
        - security
    - title: New Features ✨
      labels:
        - enhancement
        - feature
    - title: Bug Fixes 🐛
      labels:
        - bug
    - title: Documentation 📝
      labels:
        - documentation
    - title: Dependencies 📦
      labels:
        - dependencies
    - title: Maintenance 🧹
      labels:
        - chore
        - refactor
    - title: Other Changes
      labels:
        - "*"
